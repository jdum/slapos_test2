[buildout]
extends =
  ../libffi/buildout.cfg
  ../python-cffi/buildout.cfg
  ../rust/buildout.cfg

parts =
  bcrypt

[bcrypt-env]
CPPFLAGS=-I${libffi:location}/include
CFLAGS=-I${libffi:location}/include
PATH=${rustc:location}/bin:${patch:location}/bin:%(PATH)s

[bcrypt]
recipe = zc.recipe.egg:custom
egg = bcrypt

rpath =
  ${libffi:location}/lib/
environment = bcrypt-env
setup-eggs =
  ${python-cffi:egg}
